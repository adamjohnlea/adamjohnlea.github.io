name: "Adam Lea"
baseURL: "https://adamjohnlea.github.io"
outputDirectory: "_Site"
contentDirectory: "Content"
defaultLanguage: "en"
blogURLPrefix: "blog"

author:
  name: "Adam Lea"
  email: "you@example.com"  # TODO: publish a real address here or remove the line

navigation:
